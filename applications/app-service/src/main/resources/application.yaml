server:
  port: 8080
spring:
  application:
    name: "CrediYa"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  adapters:
    mariadb:
      database: "crediya_autenticacion"
      host: "localhost"
      port: 3306
      username: "crediya_user"
      password: "crediya123"
      pool:
        initial-size: 12
        max-size: 15
        max-idle-time: 10
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
