server:
  port: 8080
spring:
  application:
    name: "CrediYa"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  security:
    oauth2:
      resourceserver:
        jwt:
          secret: my-super-secret-key-change-me-123456
adapters:
  mariadb:
    database: ${DB_NAME:crediya_authentication}
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:3306}
    username: ${DB_USER:crediya_user}
    password: ${DB_PASSWORD:crediya123}
    pool:
      initial-size: 12
      max-size: 15
      max-idle-time: 10
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
app:
  server-id: "auth"
logging:
  level:
    io.r2dbc.postgresql.client.ReactorNettyClient: ERROR
    org.springframework.r2dbc.core: ERROR